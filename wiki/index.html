<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacSpaces Reference</title>
<style>
:root{--bg:#fff;--surface:#f8f5eb;--text:#111;--muted:#5b5b57;--faint:#8a8a85;--line:rgba(17,17,17,.12);--line-2:rgba(17,17,17,.24);--red:#d92a2a;--on-accent:#fff;--wash:rgba(17,17,17,.05);--term-bg:#141414;--term-border:#2a2a2a;--term-head:#0e0e0e;--term-text:#f8f5eb;--term-shadow:rgba(17,17,17,.18);--maxw:1180px;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-family:var(--sans);color:var(--text);background:var(--bg);font-size:17px;line-height:1.6;color-scheme:light}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#121212;--text:#f8f5eb;--muted:rgba(248,245,235,.56);--faint:rgba(248,245,235,.34);--line:rgba(248,245,235,.12);--line-2:rgba(248,245,235,.22);--red:#d92a2a;--on-accent:#0a0a0a;--wash:rgba(248,245,235,.06);--term-bg:#141414;--term-border:#2a2a2a;--term-head:#0e0e0e;--term-text:#f8f5eb;--term-shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 20px 80px}

header.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:24px 28px;box-shadow:0 1px 3px var(--term-shadow)}
.mark{width:64px;height:64px;border-radius:14px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain}
.mark-fallback{font-family:var(--mono);font-weight:800;font-size:20px;color:var(--text)}
.hero-text h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.hero-text p{color:var(--muted);font-size:14px;margin-top:2px}
.hero-meta{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.eyebrow{display:inline-flex;gap:9px;align-items:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);
  background:var(--bg);padding:6px 12px}
.theme-toggle{appearance:none;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);background:var(--bg);border:1px solid var(--line);
  padding:6px 12px;cursor:pointer}
.theme-toggle:hover{color:var(--red);border-color:var(--red)}

nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-family:var(--sans);font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{color:var(--text);border-color:var(--line-2)}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab .ic{font-size:13px;opacity:.85}

.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:22px 24px;box-shadow:0 1px 3px var(--term-shadow);margin-bottom:18px}
section.card h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
section.card h2::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px;flex:0 0 auto}
section.card p{font-size:14.5px;color:var(--text);margin:0 0 .7em}
section.card p:last-child{margin-bottom:0}
a{color:var(--red)} a:hover{text-decoration:underline}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-weight:700;color:var(--muted);text-transform:uppercase;
  font-size:11px;letter-spacing:.5px;padding:8px 12px;border-bottom:2px solid var(--line-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--wash)}
code,td code{font-family:var(--mono);font-size:12.5px;background:var(--wash);padding:1px 5px;
  border-radius:5px;color:var(--red)}
td:first-child{font-family:var(--mono);font-size:12.5px}

pre.diagram{background:var(--term-bg);color:var(--term-text);border:1px solid var(--term-border);
  border-radius:12px;padding:20px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.45}

ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px;border-left:2px solid var(--line);margin-left:14px}
ol.steps li:last-child{border-left-color:transparent;padding-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:-15px;top:-2px;width:28px;height:28px;
  background:var(--red);color:var(--on-accent);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700}
ol.steps .st-title{font-weight:600;font-size:14.5px}
ol.steps .st-detail{font-size:13.5px;color:var(--muted);margin-top:3px}

footer{background:var(--term-head);border-top:3px solid var(--red);color:var(--term-text);
  padding:20px 0;font-size:12px}
footer .wrap{padding-top:0;padding-bottom:0}
.err{background:var(--wash);color:var(--red);padding:16px;border-radius:10px;font-size:14px}
.tab:focus-visible,.theme-toggle:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>

     "type": "prose",
     "heading": "What it is",
     "body": "Parallel directory-tree sizer with a bounded task pool, live stats, cancellation — and, as of v1.1, a deadlock fix that the old implementation needed to survive real trees."
    },
    {
     "type": "prose",
     "heading": "The deadlock fix",
     "body": "scanDirectory acquired a semaphore permit at entry and released it in defer — i.e. AFTER awaiting the child TaskGroup. Every child needs a permit, so with concurrency 12, twelve parents blocked waiting on their children hold all twelve permits while their children wait forever. Any real home directory (deep chains, node_modules) triggers it. The fix releases the permit with an explicit synchronous signal() immediately after contentsOfDirectory, before spawning children — the permit now bounds only enumerations, never waits. The regression test (deep 6-level chain and 30-branch fan-out at concurrency 2) hangs under the old code.\n\nThe same test caught a counting bug: subdirectories were tallied +1 as a parent entry AND again inside the child's own itemCount — every directory counted twice (19 instead of 13 on the fixture). Directories are now counted only via their own node."
    },
    {
     "type": "prose",
     "heading": "Primitives and skip rules",
     "body": "AsyncSemaphore is a lock-based counting semaphore (NSLock + CheckedContinuation queue) whose signal() is synchronous — required by the fix. ScanStats is an actor that AppModel samples every 250 ms into ScanProgress. shouldSkip applies two rule sets: noise names (.Spotlight-V100, .Trashes, …) at any depth, and root prefixes (/System/Volumes firmlinks, /dev, /private/var/vm, /Volumes) only when scanning from \"/\" so APFS firmlinks don't double-count. Symlinks are never counted or descended. Sizes prefer totalFileAllocatedSize. IgnoreRules.shared.excludes(path:) is consulted per entry, and sequentialSize honors it too."
    },

     "body": "squarify(values:in:) partitions a CGRect into one rect per value with area proportional to value — the worst-ratio row-growing loop replaces the naive alternating split that produced long thin strips. Emitted rects are clamped to the bounds (accumulated FP drift pushed strip edges past the container in the first test run).\n\ntiles(for:in:) subdivides recursively with four readability constraints: children whose tile would fall below minTile (10 pt) per side aggregate into a single gray Other tile; a post-layout pass re-culls kept children that siblings squeezed below minTile on an axis (three iterations — the Other tile absorbs them and reflows); subdivision stops at maxDepth 6 and an 800-tile budget, so huge trees degrade to parent tiles rather than churning thousands of rects.\n\nA lone sub-threshold child cannot produce a visible Other (its area is below minTile² by definition) — aggregates become visible only when several small children sum above the threshold. The culling test fixture encodes exactly that case: five 50 MB children among 70 GB siblings."

    {
     "type": "prose",
     "heading": "What it is",
     "body": "MacSpaces is a native macOS utility that monitors disk usage and reclaims space, with purpose-built audits for local AI tooling: Ollama model stores, llama.cpp and other GGUF runtimes (LM Studio, Jan, GPT4All, HuggingFace), Xcode/SwiftPM caches, and APFS local Time Machine snapshots. It ships as a single ad-hoc-signed .app built entirely with SwiftPM, and its binary doubles as a headless CLI auditor (--audit-json / --scheduled-audit).\n\nThe codebase splits into two SwiftPM targets. MacSpacesCore holds everything that thinks — value types, five scanners, seven services — with no SwiftUI, so the macro-free test runner can link it. The MacSpaces app target holds everything that draws: the @main scene, a menu bar extra with quick-clean actions, and eight views. Views observe AppModel (injected via .environmentObject) and never touch the filesystem; every mutation flows through AppModel, which delegates to Core services and refreshes the relevant audit afterward."
    },
    {
     "type": "prose",
     "heading": "v1.1 changelog — bugs fixed",
     "body": "Bounded-pool deadlock: DiskScanner.scanDirectory held its semaphore permit across the child TaskGroup await; 12 blocked parents could hold all 12 permits while children waited forever. The permit is now released immediately after enumeration, before waiting on children. A regression test scans deep (6-level) and wide (30-branch) trees at concurrency 2 — it hangs under the old code.\n\nItem double-counting: the tree scanner added +1 per subdirectory entry AND included the child node's own count — every directory was counted twice. The deep-tree fixture exposed it (19 vs the correct 13).\n\nOrphan-cleanup TOCTOU: between audit and deletion a running Ollama server can reference a previously-orphaned blob in a new pull. cleanOrphanedBlobs now re-runs the audit inside the delete path and trashes only blobs still orphaned; skipped blobs are reported.\n\nHomebrew version reported the package dir name ('llama.cpp') instead of the Cellar version directory; dialogs under permanent-delete mode claimed Trash semantics; sidebar badges rendered '0'; an emptied custom-GGUF list silently reverted to defaults."
    },
    {
     "type": "prose",
     "heading": "Space map usability round",
     "body": "The first Space Map (alternating HStack/VStack split, 3-color depth cycling, render-everything) produced thin strips, 'More...' label soup, and no way to act on what you saw. Replaced with a proper package: SpaceMapLayout in Core implements the Bruls squarified treemap (area conservation, bounded aspect ratios), area-based culling into an Other aggregate, iterative re-culling of kept children squeezed below minTile on an axis, an 800-tile budget and maxDepth 6, and FP-drift clamping to bounds.\n\nSpaceMapView renders the tiles with color per top-level branch (golden-angle hue, darkening with depth — color answers 'which branch am I in'), a strict label policy (name+size when the tile fits, name when smaller, nothing below), a hover info bar with percent-of-view and full path, click-to-zoom with a breadcrumb bar, a clickable legend, and Reveal/Trash context menus (Trash-only from the map).\n\nThe Disk Usage toolbar moved the mode switch to principal placement with short labels (Map / Tree / Files) — it now sits centered in the top bar instead of truncating at the trailing edge.\n\nTestable-by-construction: the layout is pure CoreGraphics in Core; 16 new assertions cover area conservation, the aspect-ratio bound that kills strips, culling, the tile budget, and degenerate inputs. 121 total."
    },
    {
     "type": "prose",
     "heading": "v1.1 security round 2",
     "body": "Symlink-safe fixed-path writes: ScheduledAudit gained isSafeWriteTarget (refuses symlinked targets and missing parent dirs) and it now guards the audit-report write, the launchd plist write, and the save-panel export — a pre-planted symlink can no longer redirect those writes.\n\nIgnoreRules hardening: runs of '*' collapse to a single quantifier (single '*' = [^/]* within a segment, '**' = .* across segments), patterns are capped at 256 chars and 500 rules — pathological input can no longer backtrack-blow up the per-file excludes() call. The test compiles a 300-token pathological glob and asserts a 200-char path matches in under 0.5 s.\n\nDeletion root guard: TrashService.refusalReason refuses '/' and the home directory itself, so a pathological configured path can never become a catastrophic delete.\n\nModel-delete TOCTOU: deleteOllamaModel now re-runs the audit in the delete path and trashes manifest + unique blobs from the FRESH model set (previously it computed from the stale on-screen audit). Migration dedupe moved before reference counting, so the same model present in manifests/ and manifests-v2/ no longer inflates shared-layer attribution — verified against the live store (26 deduped models, 2 orphans) with an independent implementation."
    },
    {
     "type": "prose",
     "heading": "Installer and open-source packaging",
     "body": "scripts/build-app.sh grew --universal (arm64+x86_64 fat binary via SwiftPM cross-compilation, verified with lipo) and --dmg (drag-to-Applications UDZO disk image via hdiutil over a staging dir with an /Applications symlink). A bash 3.2 pitfall surfaced in testing: empty array expansion is 'unbound' under set -u, fixed with the ${ARCH_ARGS[@]+…} guard.\n\nscripts/notarize.sh covers distribution: Developer ID signing with --options runtime --timestamp, notarytool submission from a keychain profile, stapler staple, and a final spctl check — printing full credential setup instructions when env vars are absent.\n\nOpen-sourced under Apache 2.0 (Copyright 2026 Xtracsys LLC): canonical LICENSE text with the boilerplate appendix, NOTICE (zero third-party content — Apple frameworks only, icon generated at build time), CONTRIBUTING.md (test-gate rules, deletion-surface guardrails, SPDX header convention), .gitignore, and a git repo prepared for GitHub upload."

     "heading": "v1.1 changelog — the ten features",

    },
    {
     "type": "prose",
     "heading": "Harness and coverage",
     "body": "TestRecorder collects failures with file:line; expectEqual prints both values. @main TestMain runs the suites (the deep-tree scan is async/awaited) and prints ALL TESTS PASSED or a numbered failure list. Run: swift run --scratch-path .build/tests macspaces-tests — the separate scratch path builds tests under the default 27.0 SDK while the SwiftUI app uses 26.5. The runner uses @testable import MacSpacesCore: a plain import compiles but leaves every internal type invisible ('cannot find DiskNode').\n\nSuites: OllamaAuditTests (orphan detection with shared layers, missing blobs, unique-blob deletion math, pid probing, version grouping newest-first, quant-tag heuristics), LlamaAuditTests (dedupe, custom folders, GGUF byte-level header fixture, Homebrew version resolution), IgnoreRulesTests (bare names, descendants, segment-crossing stars, escaping), DiskTreeTests (removing() totals, largestFiles, skip rules + the async deadlock regression), ReportTests (ScheduledAudit.run against the real machine + JSON encoding), and SecurityTests (root/home deletion guards, planted-symlink write refusal, pathological-glob compile + timing, pattern caps, migration-dedupe reference honesty)."
    },

     "type": "prose",
     "heading": "Fixtures that earned their keep",
     "body": "The deep/wide tree scan at concurrency 2 hangs forever under the pre-fix scanner — it is the deadlock regression test. The same fixture exposed directory double-counting (19 vs 13). The GGUF fixture builds a valid v3 header byte-by-byte (and a bogus file for the nil path). Ollama fixtures use 4096-multiple blob sizes so APFS allocated size equals written size, resolve symlinks on both sides of path comparisons (/var vs /private/var), and give each test a fresh temp root."

<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RICH = /(https?:\/\/[^\s<>()"]+[^\s<>().,;:"]|`[^`]+`|(?:[A-Za-z0-9_.\-]+\/)*[A-Za-z0-9_.\-]+\.(?:py|go|js|ts|tsx|jsx|md|json|html|css|sh|gd|tscn|toml|ya?ml|cfg|txt|rs|java|c|cpp|h|rb|php)(?![A-Za-z0-9_.\-]))/g;
function rich(s){
  return esc(s).replace(RICH, m => {
    if (m.startsWith('http')) return '<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>';
    if (m.startsWith('`')) return '<code>'+m.slice(1,-1)+'</code>';
    return '<code>'+m+'</code>';
  });
}

function renderSection(sec){
  let h = '<section class="card">';
  if (sec.heading) h += `<h2>${esc(sec.heading)}</h2>`;
  if (sec.type === 'prose'){
    h += String(sec.body ?? '').split(/\n\n+/).map(p => `<p>${rich(p)}</p>`).join('');
  } else if (sec.type === 'diagram'){
    h += `<pre class="diagram">${esc(sec.body)}</pre>`;
  } else if (sec.type === 'table'){
    h += '<table><thead><tr>' + (sec.columns||[]).map(c=>`<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
    h += (sec.rows||[]).map(r=>'<tr>'+r.map(cell=>`<td>${rich(cell)}</td>`).join('')+'</tr>').join('');
    h += '</tbody></table>';
  } else if (sec.type === 'steps'){
    h += '<ol class="steps">' + (sec.items||[]).map(it=>
      `<li><div class="st-title">${rich(it.title)}</div><div class="st-detail">${rich(it.detail)}</div></li>`).join('') + '</ol>';
  }
  return h + '</section>';
}

function applyTheme(theme){
  const root = document.documentElement;
  root.dataset.theme = theme;
  document.body.style.backgroundColor = theme==='dark' ? '#0a0a0a' : '#fff';
}

function build(data){
  const meta = data.meta || {};
  document.getElementById('m-title').textContent = meta.title || 'Code Wiki';
  document.getElementById('m-sub').textContent = meta.subtitle || '';
  document.getElementById('m-ver').textContent = 'v' + (meta.version || '');
  document.getElementById('m-date').textContent = meta.date || '';
  document.title = meta.title || 'Code Wiki';
  const logo = meta.logo || '';
  document.getElementById('mark').innerHTML = logo
    ? `<img src="${logo}" alt="logo">` : '<span class="mark-fallback">X</span>';
  const sources = (meta.sources || []);
  const srcLine = sources.length > 8
    ? sources.slice(0,8).join('  •  ') + `  •  +${sources.length-8} more`
    : sources.join('  •  ');
  document.getElementById('foot').textContent =
    (srcLine ? 'Sources: ' + srcLine + '  —  ' : '') + (meta.date || '') +
    `  ·  Edit ${meta.data_file || 'wiki_data.json'} then run wikiupdate.py`;

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');
  tabsEl.innerHTML = '';
  contentEl.innerHTML = '';
  const storeKey = 'wiki-tab:' + (meta.title || 'default');
  const saved = localStorage.getItem(storeKey);

  (data.tabs || []).forEach((tab)=>{
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.type = 'button';
    btn.innerHTML = `<span class="ic">${esc(tab.icon||'')}</span>${esc(tab.label)}`;
    btn.dataset.id = tab.id;
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + tab.id;
    panel.innerHTML = (tab.sections || []).map(renderSection).join('');
    contentEl.appendChild(panel);

    btn.addEventListener('click', ()=>activate(tab.id));
  });

  if (!(data.tabs || []).length){
    contentEl.innerHTML = `<div class="err">No tabs in ${meta.data_file || 'wiki_data.json'}</div>`;
    return;
  }
  const start = (saved && data.tabs.some(t=>t.id===saved)) ? saved : data.tabs[0].id;
  activate(start);
}

function activate(id){
  document.querySelectorAll('.tab').forEach(b=>{
    const on = b.dataset.id===id;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
  const meta = (window.__WIKI_META__ || {});
  localStorage.setItem('wiki-tab:' + (meta.title || 'default'), id);
}

(function(){
  const savedTheme = localStorage.getItem('wiki-theme');
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  const toggle = document.getElementById('theme-toggle');
  toggle.addEventListener('click', ()=>{
    const next = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
    localStorage.setItem('wiki-theme', next);
    applyTheme(next);
  });
  let data = null;
  try{
    const node = document.getElementById('wiki-data');
    if (node && node.textContent.trim()){
      const parsed = JSON.parse(node.textContent.replace(/<\\\//g, '</'));
      if (parsed.tabs && parsed.tabs.length) data = parsed;
    }
  }catch(e){ /* fall through to fetch */ }
  if (data){ window.__WIKI_META__ = data.meta; build(data); return; }
  fetch("wiki_data.json")
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d=>{ window.__WIKI_META__ = d.meta; build(d); })
    .catch(e=>{
      document.getElementById('content').innerHTML =
        `<div class="err"><strong>Could not load data.</strong><br>${esc(e.message)}</div>`;
    });
})();
</script>
</body>
</html>
